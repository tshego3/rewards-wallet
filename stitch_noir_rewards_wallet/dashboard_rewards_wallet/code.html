<script>
        // Micro-interaction for filter chips
        const chips = document.querySelectorAll('section button');
        chips.forEach(chip => {
            chip.addEventListener('click', () => {
                chips.forEach(c => {
                    c.classList.remove('bg-primary', 'text-on-primary');
                    c.classList.add('bg-secondary-container', 'text-on-surface-variant');
                });
                chip.classList.remove('bg-secondary-container', 'text-on-surface-variant');
                chip.classList.add('bg-primary', 'text-on-primary');
            });
        });

        // Atmospheric Scroll Effect
        window.addEventListener('scroll', () => {
            const header = document.querySelector('header');
            if (window.scrollY > 20) {
                header.classList.add('glass-panel');
            } else {
                header.classList.remove('glass-panel');
            }
        });
    </script>
